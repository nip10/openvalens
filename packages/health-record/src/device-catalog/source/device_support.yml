#
#   device_support.yml
#
#   This file is used for adding metadata/flags to gadgets which is shown in gadget pages found under
#   "docs/gadgets" directory, serving as a machine-readable database for all gadgets supported by Gadgetbridge.
#
#   Then, the status of gadget can be obtained in markdown via "{{ device("xiaomi_mi_band_1") }}" tag.
#   NOTE: Make sure to add this call after the header name, for example:
#
#   ## Mi Band 1 {{ device("xiaomi_mi_band_1") }}
#
#   Since the device() function also inserts a anchor ID for header, it needs to be placed next to the
#   header name, so the header will now have "xiaomi_mi_band_1" as anchor, regardless of its header text,
#   and can be linked to it easily.
#
#   Every gadget which is supported by Gadgetbridge needs to be included in this page, so the website
#   can show additional metadata for devices like how well it is supported in Gadgetbridge.
#
#   To add a new device entry here, at least three keys must be added: "category", "vendor", "flags".
#   "category" is the directory name where this gadget referenced in, "vendor" is the name of the Markdown file
#   without the extension where this gadget referenced in. So for example:
#
#   huawei_freearc:
#     vendor: huawei
#     category: headphoness
#     flags: [feature_most, pair_free]
#
#   This means the gadget MUST BE referenced in `gadgets/headphones/huawei.md` file,
#   following this format: `gadgets/<category>/<vendor>.md`
#   Referencing this gadget elsewhere will render an error.
#
#   "flags" is an array of strings to inform the status of the implementation in Gadgetbridge and tell pairing
#   information. The up-to-date list of all flags can be found in "extra_config.yml" file, but here is a small
#   quick reference:
#
#     - "feature_unknown" - Implementation status is unknown, this flag MUST be added if there is no other feature_* flag is added for the device.
#     - "feature_high" - Major features of this gadget are supported by Gadgetbridge
#     - "feature_most" - Missing features, but should be "acceptable" for daily-drive
#     - "feature_partial" - Missing important features, meaning daily-driving may not be solely possible with Gadgetbridge
#     - "feature_poor" - Missing many features, probably only be able to pair with Gadgetbridge and that's all
#     - "pair_free" - Requires no vendor app at any stage to pair this device with Gadgetbridge
#     - "experimental" - Works with Gadgetbridge, but it is not verified if this device functions correctly with Gadgetbridge
#
__aliases:
  - &flags_unknown [feature_unknown, pair_unknown]
  - &flags_unknown_free [feature_unknown, pair_free]
  - &flags_high_free [feature_high, pair_free]
  - &flags_high_huami [feature_high, pair_huami]
  - &flags_unknown_huami [feature_unknown, pair_huami]
  - &flags_high_fossil [feature_high, pair_fossil]
  - &flags_zepp_os [feature_high, pair_huami, os_zepp]
  - &flags_garmin [feature_partial, pair_free, os_garmin]
  - &flags_garmin_sleep [feature_most, pair_free, os_garmin]
  - &flags_zepp_os_untested [feature_unknown, pair_huami, experimental, os_zepp]
  - &flags_zepp_os_3 [feature_partial, pair_huami, os_zepp]
