name: Release

# Issue #306 — a release tag `vMAJOR.MINOR.PATCH` gets a draft GitHub Release.
# The owner reviews the notes and publishes it (docs/releasing.md). Mobile
# store builds for the same tag run in release-mobile.yml.
# Issue #446 — the notes (docs/releases/vX.Y.Z.md) are required: they are also
# the public changelog and the in-app "What's new" card, so a tag without them,
# or without a `## Highlights` section, fails here instead of falling back to
# generated notes.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v1.0.0"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  github-release:
    name: Draft GitHub Release
    # Official releases come from the upstream repository only (TRADEMARK.md).
    if: github.repository == 'nip10/openvalens'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: The tag is vMAJOR.MINOR.PATCH
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::'$TAG' is not a release tag (vMAJOR.MINOR.PATCH)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: package.json, app.json and the server version equal the tag
        run: bun scripts/release-version.ts --check "$TAG"
      - name: The release notes exist and have Highlights and a release date
        run: |
          tag_date=$(TZ=UTC git for-each-ref "refs/tags/$TAG" --format='%(creatordate:format-local:%Y-%m-%d)')
          bun scripts/release-notes.ts --check "$TAG" --tag-date "$tag_date"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release for $TAG already exists; leaving it as it is."
            exit 0
          fi
          gh release create "$TAG" --draft --verify-tag --title "OpenValens $TAG" \
            --notes-file "docs/releases/$TAG.md"
          {
            echo "### Draft release created for $TAG"
            echo "Review the notes, then publish it: https://github.com/${GITHUB_REPOSITORY}/releases"
          } >> "$GITHUB_STEP_SUMMARY"
