name: Release

# Issue #306 — a release tag `vMAJOR.MINOR.PATCH` gets a draft GitHub Release.
# The owner reviews the notes and publishes it (docs/releasing.md). Mobile
# store builds for the same tag run in release-mobile.yml.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v1.0.0"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  github-release:
    name: Draft GitHub Release
    # Official releases come from the upstream repository only (TRADEMARK.md).
    if: github.repository == 'nip10/openvalens'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: The tag is vMAJOR.MINOR.PATCH
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::'$TAG' is not a release tag (vMAJOR.MINOR.PATCH)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: package.json, app.json and the server version equal the tag
        run: bun scripts/release-version.ts --check "$TAG"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release for $TAG already exists; leaving it as it is."
            exit 0
          fi
          args=(--draft --verify-tag --title "OpenValens $TAG")
          notes="docs/releases/$TAG.md"
          if [ -f "$notes" ]; then
            args+=(--notes-file "$notes")
          else
            echo "::warning::No $notes in the tag; using generated notes. Edit them before publishing."
            args+=(--generate-notes)
          fi
          gh release create "$TAG" "${args[@]}"
          {
            echo "### Draft release created for $TAG"
            echo "Review the notes, then publish it: https://github.com/${GITHUB_REPOSITORY}/releases"
          } >> "$GITHUB_STEP_SUMMARY"
