name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Required by the web build's varlock schema; placeholder only.
  VITE_SERVER_URL: http://localhost:3000

jobs:
  check:
    name: Lint, format, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Check generated environment reference
        run: bun run docs:check
      - run: bunx oxlint
      - run: bunx oxfmt --check .
      - run: bun run check-types
      - run: bun test
      - name: Mounted plain-water interaction regressions
        working-directory: apps/web
        run: bun run test:mounted-water

  server-image-sanitizer:
    name: Built server image Sharp sanitizer proof
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # Synthetic build-time env values only: no real secrets, providers or DB.
      - name: Write synthetic build-time env files
        run: |
          env_dir="$RUNNER_TEMP/openvalens-build-env"
          mkdir -p "$env_dir"
          cat > "$env_dir/web.env" <<'EOF'
          NODE_ENV=production
          VITE_SERVER_URL=http://localhost:3000
          EOF
          cat > "$env_dir/server.env" <<'EOF'
          NODE_ENV=production
          BETTER_AUTH_SECRET=synthetic-build-only-auth-secret-000000000000
          BETTER_AUTH_URL=http://localhost:3000
          CORS_ORIGIN=http://localhost:3001
          DATABASE_URL=postgres://synthetic:synthetic@127.0.0.1:5432/openhealth
          CRON_SECRET=synthetic-build-only-cron-secret
          TELEGRAM_WEBHOOK_SECRET=synthetic-build-only-webhook-secret
          EMAIL_FROM=CI Smoke <ci-smoke@example.invalid>
          EMAIL_DRY_RUN=true
          EOF
          chmod 0600 "$env_dir"/*.env
          echo "OPENVALENS_BUILD_ENV=$env_dir" >> "$GITHUB_ENV"
      - name: Build production server image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --secret id=web_env,src="$OPENVALENS_BUILD_ENV/web.env" \
            --secret id=server_env,src="$OPENVALENS_BUILD_ENV/server.env" \
            -f apps/server/Dockerfile \
            -t openvalens-server:image-sanitizer-proof .
      - name: Run Sharp sanitizer proof in emitted server distribution
        run: |
          docker run --rm --network none \
            openvalens-server:image-sanitizer-proof \
            bun dist/image-sanitizer-smoke.mjs

  integration:
    name: Postgres integration suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Issue #62 — disposable S3-compatible store for the object storage
      # suites. Synthetic credentials; loopback only; nothing leaves the runner.
      - name: Start disposable MinIO
        run: |
          docker run -d --name ci-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=ci-synthetic -e MINIO_ROOT_PASSWORD=ci-synthetic-secret \
            bitnamilegacy/minio:2025.5.24-debian-12-r5
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:9000/minio/health/live && exit 0; sleep 1; done
          docker logs ci-minio; exit 1
      - name: Run integration suites (disposable service database)
        env:
          PG_ADMIN_URL: postgres://postgres:ci@127.0.0.1:5432
          STORAGE_S3_TEST_ENDPOINT: http://127.0.0.1:9000
          STORAGE_S3_TEST_ACCESS_KEY_ID: ci-synthetic
          STORAGE_S3_TEST_SECRET_ACCESS_KEY: ci-synthetic-secret
        run: |
          scripts/test-integration.sh
          bun test packages/storage/src/providers/s3.minio.test.ts
