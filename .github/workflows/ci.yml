name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Required by the web build's varlock schema; placeholder only.
  VITE_SERVER_URL: http://localhost:3000

jobs:
  check:
    name: Lint, format, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx oxlint
      - run: bunx oxfmt --check .
      - run: bun run check-types
      - run: bun test

  integration:
    name: Postgres integration suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Run integration suites (disposable service database)
        env:
          PG_ADMIN_URL: postgres://postgres:ci@127.0.0.1:5432
        run: scripts/test-integration.sh
