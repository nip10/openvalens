name: Registry images

# Option 3 (docs/deployment.md): CI builds and pushes the server and web
# images to GHCR so Coolify only pulls — the VPS never builds again. The
# builds were repeatedly melting the VPS (load 130, ICMP starvation), while
# the same builds run fine on GitHub runners.
#
# Build-time env values are synthetic (no real secrets, providers or DB) —
# the same pattern as the server-image-sanitizer job in ci.yml. Runtime
# configuration comes from Coolify environment variables, except
# VITE_SERVER_URL which is baked into the web bundle at build time and must
# be the production API origin (docs/deployment.md §web).
#
# Deliberately uses the plain `docker build`/`docker push` CLI rather than
# build-push-action: the sanitizer job proves that path, while
# build-push-action runs of the identical Dockerfile + env content failed
# in varlock's env parsing during bun install (first run of this workflow).

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: registry-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  SERVER_IMAGE: ghcr.io/nip10/openvalens-server
  WEB_IMAGE: ghcr.io/nip10/openvalens-web
  # The public API origin, baked into the web bundle (docs/deployment.md).
  PROD_SERVER_URL: https://app.openvalens.com

jobs:
  server-image:
    name: Build and push server image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Write synthetic build-time env files
        run: |
          env_dir="$RUNNER_TEMP/openvalens-build-env"
          mkdir -p "$env_dir"
          cat > "$env_dir/web.env" <<'EOF'
          NODE_ENV=production
          VITE_SERVER_URL=http://localhost:3000
          EOF
          cat > "$env_dir/server.env" <<'EOF'
          NODE_ENV=production
          BETTER_AUTH_SECRET=synthetic-build-only-auth-secret-000000000000
          BETTER_AUTH_URL=http://localhost:3000
          CORS_ORIGIN=http://localhost:3001
          DATABASE_URL=postgres://synthetic:synthetic@127.0.0.1:5432/openvalens
          CRON_SECRET=synthetic-build-only-cron-secret
          TELEGRAM_WEBHOOK_SECRET=synthetic-build-only-webhook-secret
          EMAIL_FROM=CI Smoke <ci-smoke@example.invalid>
          EMAIL_DRY_RUN=true
          EOF
          chmod 0600 "$env_dir"/*.env
          echo "OPENVALENS_BUILD_ENV=$env_dir" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build server image
        run: |
          docker build \
            --secret id=web_env,src="$OPENVALENS_BUILD_ENV/web.env" \
            --secret id=server_env,src="$OPENVALENS_BUILD_ENV/server.env" \
            -f apps/server/Dockerfile \
            -t "$SERVER_IMAGE:main" \
            -t "$SERVER_IMAGE:sha-${GITHUB_SHA}" .
      - name: Push server image
        run: docker push --all-tags "$SERVER_IMAGE"

  web-image:
    name: Build and push web image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Write build-time env files
        run: |
          env_dir="$RUNNER_TEMP/openvalens-build-env"
          mkdir -p "$env_dir"
          # VITE_SERVER_URL must be the production API origin: it is baked
          # into the web bundle at build time (docs/deployment.md).
          cat > "$env_dir/web.env" <<EOF
          NODE_ENV=production
          VITE_SERVER_URL=${PROD_SERVER_URL}
          EOF
          # The web build mounts server.env too (bun install reads both
          # workspaces' env files), but no server value is baked into the
          # nginx image — synthetic placeholders suffice.
          cat > "$env_dir/server.env" <<'EOF'
          NODE_ENV=production
          BETTER_AUTH_SECRET=synthetic-build-only-auth-secret-000000000000
          BETTER_AUTH_URL=http://localhost:3000
          CORS_ORIGIN=http://localhost:3001
          DATABASE_URL=postgres://synthetic:synthetic@127.0.0.1:5432/openvalens
          CRON_SECRET=synthetic-build-only-cron-secret
          TELEGRAM_WEBHOOK_SECRET=synthetic-build-only-webhook-secret
          EMAIL_FROM=CI Smoke <ci-smoke@example.invalid>
          EMAIL_DRY_RUN=true
          EOF
          chmod 0600 "$env_dir"/*.env
          echo "OPENVALENS_BUILD_ENV=$env_dir" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build web image
        run: |
          docker build \
            --build-arg VITE_SERVER_URL="$PROD_SERVER_URL" \
            --secret id=web_env,src="$OPENVALENS_BUILD_ENV/web.env" \
            --secret id=server_env,src="$OPENVALENS_BUILD_ENV/server.env" \
            -f apps/web/Dockerfile \
            -t "$WEB_IMAGE:main" \
            -t "$WEB_IMAGE:sha-${GITHUB_SHA}" .
      - name: Push web image
        run: docker push --all-tags "$WEB_IMAGE"
