plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.homewidgettap'
version = '1.0.0'

android {
  namespace 'expo.modules.homewidgettap'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // TapRecordingWidgetProvider extends the widget library's receiver.
  implementation project(':react-native-android-widget')
}
