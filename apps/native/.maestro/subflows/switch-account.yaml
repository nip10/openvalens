# Signs out (Settings › Sign out) if signed in, and signs EMAIL in, ending on
# the Cockpit. Works in any language (test ids only).
appId: com.openvalens.app
---
- launchApp:
    stopApp: false
# Let the launch screen settle (sign-in form, or the tabs) before checking.
- extendedWaitUntil:
    visible: "Show navigation menu"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      notVisible:
        id: "sign-in-email-input"
    commands:
      - runFlow:
          file: drawer-go.yaml
          env:
            ID: drawer-settings
      - runFlow:
          file: find-id.yaml
          env:
            ID: sign-out
      - tapOn:
          id: "sign-out"
      - runFlow:
          file: confirm-sign-out.yaml
      # Signing out opens the sign-in screen (#380).
      - extendedWaitUntil:
          visible:
            id: "sign-in-email-input"
          timeout: 30000
- runFlow:
    file: sign-in.yaml
    env:
      EMAIL: ${EMAIL}
# Signed in, the app opens the tabs.
- extendedWaitUntil:
    visible:
      id: "tab-cockpit"
    timeout: 30000
