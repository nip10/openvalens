# Signs EMAIL in with a magic link, from the sign-in screen. The link comes
# from the server's dev magic-link sink through the e2e helper, which follows
# it to the openvalens:// callback the browser would hand the app.
appId: com.openvalens.app
---
# Scrolls too: on an iPhone SE the field starts below the fold (#373).
- scrollUntilVisible:
    element:
      id: "sign-in-email-input"
    timeout: 30000
- tapOn:
    id: "sign-in-email-input"
- eraseText: 60
- inputText: ${EMAIL}
- pressKey: Enter
# By id: on iOS the app starts in the simulator region's language, which a
# Portuguese store run sets to Portugal.
- extendedWaitUntil:
    visible:
      id: "sign-in-link-sent"
    timeout: 20000
- runScript: ../scripts/magic-link.js
- runFlow:
    file: open-link.yaml
    env:
      LINK: ${output.link}
