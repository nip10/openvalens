# 3. Onboarding (the new Cloud account from flow 02), three screens (#444):
# before you start (the age check; this server asks no health-data consent),
# a first entry (a weight), connect (nothing connected here), then Today with
# the "Finish setting up" card.
appId: com.openvalens.app
name: 03 Onboarding
tags: [onboarding]
---
# 1. Before you start: the only screen that can't be skipped
- extendedWaitUntil:
    visible:
      id: "chip-eligibility-adult"
    timeout: 30000
- assertNotVisible:
    id: "onboarding-skip"
- takeScreenshot: 03-onboarding-1-start
- tapOn:
    id: "chip-eligibility-adult"
- runFlow: ../subflows/onboarding-continue.yaml

# 2. Your first entry: a weight, through the quick-log fields
- extendedWaitUntil:
    visible:
      id: "first-log-weight"
    timeout: 15000
- assertVisible:
    id: "first-log-water"
- assertVisible:
    id: "first-log-sleep"
- takeScreenshot: 03-onboarding-2-first-log
- tapOn:
    id: "first-log-weight"
- extendedWaitUntil:
    visible:
      id: "first-log-weight-value"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "first-log-weight-value"
- inputText: "70"
- runFlow: ../subflows/hide-keyboard.yaml
- takeScreenshot: 03-onboarding-3-first-log-weight
- runFlow: ../subflows/onboarding-continue.yaml

# 3. Connect your data: the phone's health app, then a watch or ring
- extendedWaitUntil:
    visible:
      id: "onboarding-connect-wearable"
    timeout: 15000
- assertVisible:
    id: "onboarding-connect-bluetooth"
- takeScreenshot: 03-onboarding-4-connect
- runFlow: ../subflows/onboarding-continue.yaml

# Today, with the rest of setup as one card
- extendedWaitUntil:
    visible:
      id: "tab-cockpit"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "finish-setup"
    timeout: 20000
- assertVisible:
    id: "finish-setup-modules"
- takeScreenshot: 03-onboarding-5-today
- assertNotVisible:
    id: "chip-eligibility-adult"
