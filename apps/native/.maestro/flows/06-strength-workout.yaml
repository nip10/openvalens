# 6. Log a strength workout set by set (epic #282): start, add an exercise,
# two sets (weight × reps, marked done), finish, and find it in history.
appId: com.openvalens.app
name: 06 Strength workout
tags: [logging]
---
- runFlow: ../subflows/fresh-start.yaml
- runFlow:
    file: ../subflows/drawer-go.yaml
    env:
      ID: drawer-cockpit
- tapOn:
    id: "tab-training"
# A workout left open earlier comes back after a restart; discard it from
# the workout overview (#401).
- extendedWaitUntil:
    visible:
      id: "(workout-start|workout-minimize|workout-resume)"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "workout-resume"
    commands:
      - tapOn:
          id: "workout-resume"
- runFlow:
    when:
      visible:
        id: "workout-minimize"
    commands:
      - tapOn:
          id: "workout-overview-open"
      - scrollUntilVisible:
          element:
            id: "workout-discard"
      - tapOn:
          id: "workout-discard"
      - tapOn:
          text: "(?i)discard"
          below: "Discard workout\\?"
- extendedWaitUntil:
    visible:
      id: "workout-start"
    timeout: 20000
- tapOn:
    id: "workout-start"
- extendedWaitUntil:
    visible: "Add exercise"
    timeout: 10000
- tapOn:
    id: "workout-add-exercise"
- extendedWaitUntil:
    visible: "Add an exercise"
    timeout: 10000
# Bench press from the licensed exercise sample (#400), picked by its stable
# wger id so the flow works in en and pt-PT.
- tapOn:
    id: "exercise-pick-wger-73"

# One exercise per screen with a SET · PREVIOUS · KG · REPS · ✓ table (#401).
# Set 1, then set 2 (a rest timer starts after each finished set)
- tapOn:
    id: "workout-add-set"
- runFlow:
    file: ../subflows/workout-set.yaml
    env:
      N: "1"
      WEIGHT: "42.5"
      REPS: "8"
- scrollUntilVisible:
    element:
      id: "workout-add-set"
    centerElement: true
- tapOn:
    id: "workout-add-set"
- runFlow:
    file: ../subflows/workout-set.yaml
    env:
      N: "2"
      WEIGHT: "45"
      REPS: "6"
- scrollUntilVisible:
    element:
      id: "workout-summary"
      text: "1 exercise, 2 sets done"
    direction: UP
- takeScreenshot: 06-workout-sets

- tapOn:
    id: "workout-finish"
- scrollUntilVisible:
    element:
      id: "workout-save"
- takeScreenshot: 06-workout-finish
- tapOn:
    id: "workout-save"
- extendedWaitUntil:
    visible: "Recent sessions"
    timeout: 20000
- takeScreenshot: 06-workout-saved
