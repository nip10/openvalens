# 7. Add a body measurement (weight, and a private waist measurement), a
# vital reading and a lab result, then a blood pressure from the "+" log picker.
appId: com.openvalens.app
name: 07 Body, vitals and labs
tags: [logging]
---
- runFlow: ../subflows/fresh-start.yaml

# Weight, on the Body tab
- runFlow:
    file: ../subflows/drawer-go.yaml
    env:
      ID: drawer-body
- runFlow:
    file: ../subflows/fill-and-save.yaml
    env:
      INPUT: weight-value-input
      VALUE: "66.1"
      SAVE: "Save"
      SHOT: 07-body-add-weight
- extendedWaitUntil:
    visible: "Saved"
    timeout: 15000

# A private body measurement
- runFlow:
    file: ../subflows/drawer-go.yaml
    env:
      ID: drawer-private-measurements
- scrollUntilVisible:
    element: "Waist"
    timeout: 20000
- tapOn: "Waist"
- runFlow:
    file: ../subflows/fill-and-save.yaml
    env:
      INPUT: private-measurement-value-input
      VALUE: "78"
      SAVE: "Save entry"
      SHOT: 07-private-measurement
# Saved: the form clears and the button is disabled again ("Entry saved." is
# a screen-reader announcement, not shown on screen).
- extendedWaitUntil:
    visible:
      text: "Save entry"
      enabled: false
    timeout: 15000
- assertNotVisible: "Could not save.*"

# A vital (the first metric offered)
- runFlow:
    file: ../subflows/drawer-go.yaml
    env:
      ID: drawer-records-vitals
- runFlow:
    file: ../subflows/fill-and-save.yaml
    env:
      INPUT: vital-value-input
      VALUE: "56"
      SAVE: "Save"
      SHOT: 07-vitals-add
- extendedWaitUntil:
    visible: "Saved"
    timeout: 15000

# A lab result (the first marker offered)
- runFlow:
    file: ../subflows/drawer-go.yaml
    env:
      ID: drawer-records-labs
- runFlow:
    file: ../subflows/fill-and-save.yaml
    env:
      INPUT: lab-value-input
      VALUE: "48"
      SAVE: "Save"
      SHOT: 07-labs-add
- extendedWaitUntil:
    visible: "Saved"
    timeout: 15000

# The log picker (#440): "+" then a kind, two taps, then the values
- tapOn:
    id: "tab-log"
- extendedWaitUntil:
    visible:
      id: "quick-log-kind:blood_pressure"
    timeout: 20000
- takeScreenshot: 07-log-picker
- tapOn:
    id: "quick-log-kind:blood_pressure"
- tapOn:
    id: "quick-log-blood_pressure-systolic"
- inputText: "118"
- tapOn:
    id: "quick-log-blood_pressure-diastolic"
- inputText: "76"
- runFlow: ../subflows/hide-keyboard.yaml
- takeScreenshot: 07-log-picker-blood-pressure
- tapOn:
    id: "quick-log-save"
- extendedWaitUntil:
    visible: "Saved: Blood pressure"
    timeout: 15000
