# 10. Settings: language (en, pt-PT), units and formats, theme, modules and
# linked sign-in methods. Everything is put back at the end.
appId: com.openvalens.app
name: 10 Settings
tags: [settings]
---
- runFlow: ../subflows/fresh-start.yaml
- runFlow:
    file: ../subflows/drawer-go.yaml
    env:
      ID: drawer-settings

# Sign-in methods: the email link is always there; Google and Apple only
# show when the server has them configured (not in this suite).
- runFlow:
    file: ../subflows/find-text.yaml
    env:
      TEXT: "Sign-in methods"
- assertVisible: "Email link"
- takeScreenshot: 10-sign-in-methods

# Language: Portuguese (Portugal), then back to English
- runFlow:
    file: ../subflows/pick-option.yaml
    env:
      SELECT: "language-select"
      OPTION: "language-pt-PT"
# The label sits above the select; picking can leave it scrolled off the top.
- scrollUntilVisible:
    element: "Idioma da interface"
    direction: UP
    timeout: 10000
- takeScreenshot: 10-language-pt-PT
# Settings is a drawer screen without the tab bar (#440).
- runFlow:
    file: ../subflows/drawer-go.yaml
    env:
      ID: drawer-cockpit
- takeScreenshot: 10-cockpit-pt-PT
- runFlow:
    file: ../subflows/drawer-go.yaml
    env:
      ID: drawer-settings
- runFlow:
    file: ../subflows/pick-option.yaml
    env:
      SELECT: "language-select"
      OPTION: "language-en"
# The label sits above the select; picking can leave it scrolled off the top.
- scrollUntilVisible:
    element: "Interface language"
    direction: UP
    timeout: 10000

# Units and formats: lab units in mmol/L, dates as in the UK, then back
- runFlow:
    file: ../subflows/pick-option.yaml
    env:
      SELECT: "lab-units-select"
      OPTION: "lab-units-mmol_l"
- runFlow:
    file: ../subflows/pick-option.yaml
    env:
      SELECT: "format-select"
      OPTION: "format-en-GB"
- takeScreenshot: 10-units
- runFlow:
    file: ../subflows/drawer-go.yaml
    env:
      ID: drawer-records-labs
- extendedWaitUntil:
    visible: "Your results"
    timeout: 20000
# Each marker card has a range bar (#392), so glucose sits below the fold.
- scrollUntilVisible:
    element: "Glucose \\(fasting\\)"
    centerElement: true
    timeout: 20000
- assertVisible: ".*mmol/L.*"
- takeScreenshot: 10-labs-mmol
- runFlow:
    file: ../subflows/drawer-go.yaml
    env:
      ID: drawer-settings
- runFlow:
    file: ../subflows/pick-option.yaml
    env:
      SELECT: "lab-units-select"
      OPTION: "lab-units-as_reported"
- runFlow:
    file: ../subflows/pick-option.yaml
    env:
      SELECT: "format-select"
      OPTION: "format-default"

# Theme: dark mode on, then off
- runFlow:
    file: ../subflows/find-text.yaml
    env:
      TEXT: "Dark mode.*"
- tapOn: "Dark mode.*"
# iOS reads the row as one element ("Dark mode, On"); Android also shows the pill.
- assertVisible: "Dark mode, On|On"
- takeScreenshot: 10-dark-mode
- tapOn: "Dark mode.*"

# Modules: hide Food & water, check the Food tab goes away, turn it back on
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: openvalens:///settings/modules
- extendedWaitUntil:
    visible:
      id: "module-switch-food"
    timeout: 20000
- tapOn:
    id: "module-switch-food"
- takeScreenshot: 10-modules
- runFlow:
    file: ../subflows/drawer-go.yaml
    env:
      ID: drawer-cockpit
- assertNotVisible:
    id: "tab-nutrition"
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: openvalens:///settings/modules
- extendedWaitUntil:
    visible:
      id: "module-switch-food"
    timeout: 20000
- tapOn:
    id: "module-switch-food"
- runFlow:
    file: ../subflows/drawer-go.yaml
    env:
      ID: drawer-cockpit
- extendedWaitUntil:
    visible:
      id: "tab-nutrition"
    timeout: 15000
