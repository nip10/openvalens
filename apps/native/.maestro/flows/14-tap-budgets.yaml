# 14. The tap budgets from the fast-logging epic (#271), counted from a fresh
# launch: a recent food in 3 taps or fewer (from the diary's search bar), a new food (search, pick, amount,
# save) in 5 taps or fewer plus typing. Every user tap is a numbered `tapOn`;
# waits and asserts are not taps. Runs after 05, so Baked salmon is a recent
# breakfast food; the food database search finds the e2e catalog fixture.
appId: com.openvalens.app
name: 14 Tap budgets
tags: [logging]
---
# Flow 13 deletes its account: sign the demo account in, then count from a
# fresh launch.
- runFlow:
    file: ../subflows/switch-account.yaml
    env:
      EMAIL: alex.morgan@example.com
- runFlow: ../subflows/fresh-start.yaml
- extendedWaitUntil:
    visible:
      id: tab-nutrition
    timeout: 20000

# Recent food from the diary's search bar (#393): 3 taps. Recents and
# favourites are the search sheet's first list.
- tapOn:
    id: tab-nutrition # tap 1
- extendedWaitUntil:
    visible:
      id: diary-search-bar
    timeout: 20000
- tapOn:
    id: diary-search-bar # tap 2
- extendedWaitUntil:
    visible: "Add Baked salmon to .*"
    timeout: 15000
- tapOn: "Add Baked salmon to .*" # tap 3
- extendedWaitUntil:
    visible: "Undo"
    timeout: 10000
- takeScreenshot: 14-recent-food-logged
- runFlow: ../subflows/close-add-food.yaml

# Recent food from Add food: 3 taps.
- runFlow: ../subflows/fresh-start.yaml
- extendedWaitUntil:
    visible:
      id: tab-nutrition
    timeout: 20000
- tapOn:
    id: tab-nutrition # tap 1
- extendedWaitUntil:
    visible: "Add food to Breakfast"
    timeout: 20000
- tapOn: "Add food to Breakfast" # tap 2
- extendedWaitUntil:
    visible: "Add Baked salmon to Breakfast"
    timeout: 15000
- tapOn: "Add Baked salmon to Breakfast" # tap 3
- extendedWaitUntil:
    visible: "Saved Baked salmon.*"
    timeout: 10000
- assertVisible: "Undo"
- runFlow: ../subflows/close-add-food.yaml

# New food from the food databases: 5 taps plus typing.
- runFlow: ../subflows/fresh-start.yaml
- extendedWaitUntil:
    visible:
      id: tab-nutrition
    timeout: 20000
- tapOn:
    id: tab-nutrition # tap 1
- extendedWaitUntil:
    visible: "Add food to Breakfast"
    timeout: 20000
- tapOn: "Add food to Breakfast" # tap 2
- extendedWaitUntil:
    visible: "Search foods"
    timeout: 10000
- tapOn: "Search foods" # tap 3
- inputText: "banana"
- extendedWaitUntil:
    visible: "Food databases"
    timeout: 10000
- extendedWaitUntil:
    visible: "E2E banana, .*"
    timeout: 20000
- takeScreenshot: 14-new-food-results
- tapOn: "E2E banana, .*" # tap 4
- extendedWaitUntil:
    visible: "Save to Breakfast"
    timeout: 10000
# A new food defaults to 1 serving when it has one (#276), not the 100 g basis.
- assertVisible: "Review: E2E banana, 1 serving.*"
- takeScreenshot: 14-new-food-amount
- tapOn: "Save to Breakfast" # tap 5
- extendedWaitUntil:
    visible: "Add food to Breakfast"
    timeout: 15000
# The first logged entry is on screen without scrolling (#277): one line per
# food, read out as its name, amount and nutrients (#393).
- assertVisible: "E2E banana, .*"
- takeScreenshot: 14-new-food-logged
