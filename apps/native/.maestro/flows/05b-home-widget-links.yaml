# 5b. The home-screen widget's deep links (#449). The widget itself is native
# (WidgetKit, App Widgets) and Maestro cannot place it, so this opens the
# links its buttons open: "Log…" shows the picker; water +1 glass (without the
# widget's nonce) waits for one "Save" tap, and Undo takes it back, so the
# day's water is as flow 05 left it.
appId: com.openvalens.app
name: 05b Home-screen widget links
tags: [widget]
---
- runFlow: ../subflows/fresh-start.yaml

# "Log…": the log picker
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: "openvalens://quick-log?widget=log"
- extendedWaitUntil:
    visible:
      id: "quick-log-close"
    timeout: 20000
- takeScreenshot: 05b-widget-log
- tapOn:
    id: "quick-log-close"
- extendedWaitUntil:
    visible: "Show navigation menu"
    timeout: 10000

# Water +1 glass. Any app or page can open this link, and only the Android
# widget is given this install's nonce (#505), so a link without it does not
# save at once: the entry waits for one "Save" tap. Then Undo as usual (the
# toast stays about 6 s).
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: "openvalens://quick-log?widget=water"
- extendedWaitUntil:
    visible:
      id: "quick-log-widget-entry"
    timeout: 20000
- assertVisible: "Water · 250 ml"
- takeScreenshot: 05b-widget-water-confirm
- tapOn:
    id: "quick-log-save"
- extendedWaitUntil:
    visible: "Saved: Water · 250 ml"
    timeout: 20000
- takeScreenshot: 05b-widget-water
- tapOn: "Undo"
- extendedWaitUntil:
    visible: "Removed: Water · 250 ml"
    timeout: 10000
