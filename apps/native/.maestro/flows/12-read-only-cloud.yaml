# 12. Subscription ended in Cloud (#298): the owner's access ends, the app
# shows a neutral read-only notice (no prices, no purchase link), writes are
# refused and export still works. Then the trial is restored.
#
# Runs as Alex, the workspace owner (the helper moves the subscription).
appId: com.openvalens.app
name: 12 Read-only Cloud state
tags: [billing]
---
- runFlow:
    file: ../subflows/switch-account.yaml
    env:
      EMAIL: alex.morgan@example.com
- runScript:
    file: ../scripts/helper.js
    env:
      HELPER_PATH: "/subscription?email=alex.morgan@example.com&status=ended"
# Fresh start so the access state is read again.
- runFlow: ../subflows/fresh-start.yaml
- runFlow:
    file: ../subflows/drawer-go.yaml
    env:
      ID: drawer-cockpit
- extendedWaitUntil:
    visible:
      id: "cloud-access-notice"
    timeout: 30000
- assertVisible: "Your OpenValens Cloud access has ended.*"
- assertVisible: "Export records"
# No purchase UI in the app (App Store Review Guideline 3.1.3(f)).
- assertNotVisible: ".*(€|Subscribe|Upgrade|7\\.99|69).*"
- takeScreenshot: 12-read-only-cockpit

# A write is refused: add plain water
- runFlow:
    file: ../subflows/drawer-go.yaml
    env:
      ID: drawer-meal-diary
- runFlow:
    file: ../subflows/find-text.yaml
    env:
      TEXT: "Add plain water"
- tapOn: "Add plain water"
- extendedWaitUntil:
    visible: "Amount"
    timeout: 10000
- tapOn:
    text: "Amount"
    index: 0
- inputText: "200"
- runFlow: ../subflows/hide-keyboard.yaml
- runFlow:
    file: ../subflows/find-text.yaml
    env:
      TEXT: "Save"
- tapOn: "Save"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 12-read-only-write

# Export still works
- tapOn:
    id: "tab-cockpit"
- tapOn: "Export records"
- extendedWaitUntil:
    visible: "Download a bundle"
    timeout: 20000
- takeScreenshot: 12-read-only-export

# Restore the trial for the flows after this one
- runScript:
    file: ../scripts/helper.js
    env:
      HELPER_PATH: "/subscription?email=alex.morgan@example.com&status=trialing"
