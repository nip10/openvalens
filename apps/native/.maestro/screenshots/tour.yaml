# The screenshot tour (#302): every screen in one language and theme. run.ts
# runs it four times (en and pt-PT, light and dark: the device appearance is
# switched before each run) with PREFIX = "<locale>-<theme>". Only test ids
# are used to move around, so it works in either language.
#
# 1. Signed in as the demo account: set the language, then every tab, drawer
#    screen and sub-screen.
# 2. Signed out: the sign-in screen and the server choice.
# 3. A new Cloud account: the three first-run screens and a setup item.
appId: com.openvalens.app
name: Screenshot tour
---
- launchApp:
    stopApp: true
- runFlow:
    file: ../subflows/switch-account.yaml
    env:
      EMAIL: alex.morgan@example.com

# Language
- runFlow:
    file: ../subflows/drawer-go.yaml
    env:
      ID: drawer-settings
- runFlow:
    file: ../subflows/pick-option.yaml
    env:
      SELECT: "language-select"
      OPTION: "language-${LOCALE}"
- waitForAnimationToEnd:
    timeout: 3000

# 1. Every signed-in screen
- runFlow:
    file: ../subflows/visit-all-screens.yaml
    env:
      PREFIX: ${PREFIX}

# 2. Sign-in and server choice
- runFlow:
    file: ../subflows/drawer-go.yaml
    env:
      ID: drawer-settings
- runFlow:
    file: ../subflows/find-id.yaml
    env:
      ID: sign-out
- tapOn:
    id: "sign-out"
- runFlow:
    file: ../subflows/confirm-sign-out.yaml
- stopApp
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "sign-in-email-input"
    timeout: 30000
- takeScreenshot: ${PREFIX}-auth-01-sign-in
- runFlow: ../subflows/change-server.yaml
- takeScreenshot: ${PREFIX}-auth-02-server-choice
- tapOn:
    id: "own-server-toggle"
- hideKeyboard
- takeScreenshot: ${PREFIX}-auth-03-own-server
- runFlow:
    file: ../subflows/server-address.yaml
    env:
      ADDRESS: ${SERVER_URL}

# 3. Onboarding, as a new Cloud account
- runScript:
    file: ../scripts/helper.js
    env:
      HELPER_PATH: "/sign-up?email=tour-${PREFIX.toLowerCase()}@example.com"
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: "tour-${PREFIX.toLowerCase()}@example.com"
# Signed in, a new account goes straight to onboarding.
- extendedWaitUntil:
    visible:
      id: "onboarding-continue"
    timeout: 30000
- takeScreenshot: ${PREFIX}-onboarding-1-start
- tapOn:
    id: "chip-eligibility-adult"
- runFlow: ../subflows/onboarding-continue.yaml
- extendedWaitUntil:
    visible:
      id: "first-log-weight"
    timeout: 15000
- takeScreenshot: ${PREFIX}-onboarding-2-first-log
- tapOn:
    id: "first-log-sleep"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow: ../subflows/hide-keyboard.yaml
- takeScreenshot: ${PREFIX}-onboarding-3-first-log-sleep
- runFlow: ../subflows/onboarding-continue.yaml
- extendedWaitUntil:
    visible:
      id: "onboarding-connect-wearable"
    timeout: 15000
- takeScreenshot: ${PREFIX}-onboarding-4-connect
- runFlow: ../subflows/onboarding-continue.yaml
- extendedWaitUntil:
    visible:
      id: "tab-cockpit"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "finish-setup"
    timeout: 20000
- takeScreenshot: ${PREFIX}-onboarding-5-cockpit-new-account
- tapOn:
    id: "finish-setup-modules"
- extendedWaitUntil:
    visible:
      id: "onboarding-module-sleep"
    timeout: 15000
- takeScreenshot: ${PREFIX}-onboarding-6-modules
- tapOn:
    id: "onboarding-back"
- extendedWaitUntil:
    visible:
      id: "finish-setup"
    timeout: 15000
