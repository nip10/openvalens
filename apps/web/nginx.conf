server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Issue #127 — security headers + CSP for the web document. nginx does not
    # inherit add_header into a location that sets its own, so every location
    # includes the snippet selected by docker-entrypoint.d/40-csp-mode.sh.
    location /assets/ {
        include /etc/nginx/security-headers/active.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback
    location / {
        include /etc/nginx/security-headers/active.conf;
        try_files $uri $uri/ /index.html;
    }
}
