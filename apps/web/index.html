<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenValens</title>
    <meta name="description" content="OpenValens is an open-source, private health record" />
    <link rel="canonical" href="https://app.openvalens.com/" />
    <!-- Social previews; crawlers do not run JS, so these stay static. public/og.png is
         rendered from apps/site/og/app.html by apps/site/scripts/render-og.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenValens" />
    <meta property="og:title" content="OpenValens" />
    <meta property="og:description" content="OpenValens is an open-source, private health record" />
    <meta property="og:url" content="https://app.openvalens.com/" />
    <meta property="og:image" content="https://app.openvalens.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="OpenValens: Sign in to your private health record. Your data stays on your server."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OpenValens" />
    <meta
      name="twitter:description"
      content="OpenValens is an open-source, private health record"
    />
    <meta name="twitter:image" content="https://app.openvalens.com/og.png" />
    <meta
      name="twitter:image:alt"
      content="OpenValens: Sign in to your private health record. Your data stays on your server."
    />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
