# OpenValens production self-host stack (Issue #63).
#
# This is the ONE supported self-host install. It is separate from the root
# `docker-compose.yml`, which is the development stack. Do not edit values in
# this file: run `deploy/setup.sh`, which writes `deploy/.env` (non-secret
# settings) and `deploy/secrets/` (generated secrets), then starts the stack.
#
#   deploy/setup.sh install     # first install
#   deploy/setup.sh upgrade     # backup -> migrate -> start, after a git checkout
#
# Network model:
#   - `caddy` is the ONLY service that publishes ports (80/443, automatic HTTPS).
#     Docker-published ports bypass host firewalls such as ufw, so nothing else
#     may publish one.
#   - `postgres` lives only on the `db` network, which is `internal: true`: no
#     published port and no route to the internet.
#   - `server` joins `db` and `app` (it needs egress for email/AI providers);
#     `web` joins `app` only.
#
# Startup / upgrade order (each step must succeed before the next starts):
#   postgres (healthy) -> backup (pre-migrate hook) -> migrate -> server -> web -> caddy
#                                                             -> backup-scheduler
# A failed backup or migration leaves `server` stopped and never deletes a backup.
#
# Backups (Issue #64): every backup is encrypted with age to the key in
# deploy/secrets/backup/age-identity. Keep a copy of that file OFF this server:
# without it no backup can be restored. See docs/self-hosting/backup.md.

name: openvalens-selfhost

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Server runtime configuration. Every secret is read from a private file via the
# `<KEY>_FILE` convention; no secret value is interpolated into this file.
x-server-env: &server-env
  NODE_ENV: production
  BETTER_AUTH_URL: https://${OPENVALENS_DOMAIN:?run deploy/setup.sh first}
  CORS_ORIGIN: https://${OPENVALENS_DOMAIN:?run deploy/setup.sh first}
  # Content Security Policy (docs/security-csp.md). `enforce` is the production
  # default; `report-only` is the operator rollback. Also passed to `web`.
  CSP_MODE: ${CSP_MODE:-enforce}
  API_MAX_BODY_BYTES: ${API_MAX_BODY_BYTES:-1048576}
  # Source code link shown to users (AGPL-3.0 section 13). Point it at your
  # fork's public repository if you run a modified version.
  SOURCE_CODE_URL: ${SOURCE_CODE_URL:-https://github.com/nip10/openvalens}
  # `self-hosted` (invite-only) unless this server is OpenValens Cloud. `cloud`
  # opens public sign-up and refuses to start without the LEGAL_* settings.
  DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-self-hosted}
  LEGAL_TERMS_URL: ${LEGAL_TERMS_URL:-}
  LEGAL_TERMS_VERSION: ${LEGAL_TERMS_VERSION:-}
  LEGAL_CHECKOUT_ACK_VERSION: ${LEGAL_CHECKOUT_ACK_VERSION:-}
  LEGAL_PRIVACY_URL: ${LEGAL_PRIVACY_URL:-}
  LEGAL_PRIVACY_VERSION: ${LEGAL_PRIVACY_VERSION:-}
  LEGAL_HEALTH_CONSENT_VERSION: ${LEGAL_HEALTH_CONSENT_VERSION:-}
  # OpenValens Cloud billing (Issue #297): required when DEPLOYMENT_MODE=cloud,
  # ignored on self-host. The two secrets are files under deploy/secrets/server.
  STRIPE_SECRET_KEY_FILE: ${STRIPE_SECRET_KEY_FILE:-}
  STRIPE_WEBHOOK_SECRET_FILE: ${STRIPE_WEBHOOK_SECRET_FILE:-}
  STRIPE_PRICE_MONTHLY: ${STRIPE_PRICE_MONTHLY:-}
  STRIPE_PRICE_ANNUAL: ${STRIPE_PRICE_ANNUAL:-}
  # OpenValens Cloud subscription states (Issue #298); ignored on self-host.
  BILLING_PAST_DUE_GRACE_DAYS: ${BILLING_PAST_DUE_GRACE_DAYS:-7}
  CLOUD_ENDED_RETENTION_MONTHS: ${CLOUD_ENDED_RETENTION_MONTHS:-}
  CLOUD_ENDED_RETENTION_DRY_RUN: ${CLOUD_ENDED_RETENTION_DRY_RUN:-false}
  EMAIL_FROM: ${EMAIL_FROM:?run deploy/setup.sh first}
  EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
  EMAIL_AUDIT_BCC_FILE: ${EMAIL_AUDIT_BCC_FILE:-}
  EMAIL_DRY_RUN: ${EMAIL_DRY_RUN:-false}
  DATABASE_URL_FILE: /run/secrets/DATABASE_URL
  BETTER_AUTH_SECRET_FILE: /run/secrets/BETTER_AUTH_SECRET
  CRON_SECRET_FILE: /run/secrets/CRON_SECRET
  TELEGRAM_WEBHOOK_SECRET_FILE: /run/secrets/TELEGRAM_WEBHOOK_SECRET
  # Optional provider keys: an empty `<KEY>_FILE` is treated as unset.
  RESEND_API_KEY_FILE: ${RESEND_API_KEY_FILE:-}
  ANTHROPIC_API_KEY_FILE: ${ANTHROPIC_API_KEY_FILE:-}
  TELEGRAM_BOT_TOKEN_FILE: ${TELEGRAM_BOT_TOKEN_FILE:-}
  TELEGRAM_CONNECT_TOKEN_TTL_SECONDS: ${TELEGRAM_CONNECT_TOKEN_TTL_SECONDS:-600}
  # AI provider (docs/ai-providers.md): off unless AI_PROVIDER (or the legacy
  # ANTHROPIC_API_KEY_FILE) is set. `openai-compatible` needs AI_BASE_URL and
  # AI_MODEL; the key, when the endpoint needs one, is the AI_API_KEY secret file.
  AI_PROVIDER: ${AI_PROVIDER:-}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_API_KEY_FILE: ${AI_API_KEY_FILE:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_SUPPORTS_STRUCTURED_OUTPUTS: ${AI_SUPPORTS_STRUCTURED_OUTPUTS:-}
  AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-20}
  # Monthly AI cost cap per person (Issue #299): off unless AI_MONTHLY_COST_LIMIT
  # is set, which needs the model's prices per million tokens.
  AI_MONTHLY_COST_LIMIT: ${AI_MONTHLY_COST_LIMIT:-}
  AI_PRICE_INPUT_PER_MTOK: ${AI_PRICE_INPUT_PER_MTOK:-}
  AI_PRICE_OUTPUT_PER_MTOK: ${AI_PRICE_OUTPUT_PER_MTOK:-}
  AI_PRICE_CACHED_INPUT_PER_MTOK: ${AI_PRICE_CACHED_INPUT_PER_MTOK:-}
  AI_COST_CURRENCY: ${AI_COST_CURRENCY:-}
  # Optional live barcode lookup (Issue #69): off unless FOOD_LOOKUP_PROVIDER is set.
  FOOD_LOOKUP_PROVIDER: ${FOOD_LOOKUP_PROVIDER:-}
  FOOD_LOOKUP_USER_AGENT: ${FOOD_LOOKUP_USER_AGENT:-}
  FOOD_LOOKUP_BASE_URL: ${FOOD_LOOKUP_BASE_URL:-}
  # Optional insight push notifications (Issue #92): off unless PUSH_PROVIDER is set.
  PUSH_PROVIDER: ${PUSH_PROVIDER:-}
  # Object storage (Issue #62). Default: private local disk on the `storage`
  # volume. For an S3-compatible bucket set STORAGE_PROVIDER=s3 and the
  # STORAGE_S3_* settings in deploy/.env, with the keys as secret files.
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
  STORAGE_LOCAL_DIR: /var/lib/openvalens/storage
  DATA_EXPORT_DIR: /var/lib/openvalens/exports
  STORAGE_MAX_OBJECT_BYTES: ${STORAGE_MAX_OBJECT_BYTES:-26214400}
  STORAGE_SIGNED_URL_TTL_SECONDS: ${STORAGE_SIGNED_URL_TTL_SECONDS:-300}
  STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
  STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
  STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
  STORAGE_S3_FORCE_PATH_STYLE: ${STORAGE_S3_FORCE_PATH_STYLE:-false}
  STORAGE_S3_SSE: ${STORAGE_S3_SSE:-AES256}
  STORAGE_S3_ACCESS_KEY_ID_FILE: ${STORAGE_S3_ACCESS_KEY_ID_FILE:-}
  STORAGE_S3_SECRET_ACCESS_KEY_FILE: ${STORAGE_S3_SECRET_ACCESS_KEY_FILE:-}
  # Optional OIDC sign-in (Issue #65): off unless all four required values are set.
  OIDC_PROVIDER_ID: ${OIDC_PROVIDER_ID:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET_FILE: ${OIDC_CLIENT_SECRET_FILE:-}
  OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
  OIDC_DISPLAY_NAME: ${OIDC_DISPLAY_NAME:-}
  # Optional Sign in with Google and Apple (Issue #296): each is off until all of
  # its values are set. Secrets arrive as files under deploy/secrets/server/.
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET_FILE: ${GOOGLE_CLIENT_SECRET_FILE:-}
  APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
  APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
  APPLE_KEY_ID: ${APPLE_KEY_ID:-}
  APPLE_PRIVATE_KEY_FILE: ${APPLE_PRIVATE_KEY_FILE:-}
  APPLE_APP_BUNDLE_ID: ${APPLE_APP_BUNDLE_ID:-}
  # Optional cloud wearables (Issue #60): each vendor is off until its client id
  # and client secret file are set; phone-first ingestion needs none of them.
  WEARABLES_WEBHOOKS: ${WEARABLES_WEBHOOKS:-false}
  WEARABLES_OURA_CLIENT_ID: ${WEARABLES_OURA_CLIENT_ID:-}
  WEARABLES_OURA_CLIENT_SECRET_FILE: ${WEARABLES_OURA_CLIENT_SECRET_FILE:-}
  WEARABLES_WHOOP_CLIENT_ID: ${WEARABLES_WHOOP_CLIENT_ID:-}
  WEARABLES_WHOOP_CLIENT_SECRET_FILE: ${WEARABLES_WHOOP_CLIENT_SECRET_FILE:-}
  WEARABLES_POLAR_CLIENT_ID: ${WEARABLES_POLAR_CLIENT_ID:-}
  WEARABLES_POLAR_CLIENT_SECRET_FILE: ${WEARABLES_POLAR_CLIENT_SECRET_FILE:-}
  WEARABLES_POLAR_WEBHOOK_SECRET_FILE: ${WEARABLES_POLAR_WEBHOOK_SECRET_FILE:-}
  WEARABLES_WITHINGS_CLIENT_ID: ${WEARABLES_WITHINGS_CLIENT_ID:-}
  WEARABLES_WITHINGS_CLIENT_SECRET_FILE: ${WEARABLES_WITHINGS_CLIENT_SECRET_FILE:-}
  WEARABLES_GOOGLE_HEALTH_ENABLED: ${WEARABLES_GOOGLE_HEALTH_ENABLED:-false}
  WEARABLES_GOOGLE_HEALTH_CLIENT_ID: ${WEARABLES_GOOGLE_HEALTH_CLIENT_ID:-}
  WEARABLES_GOOGLE_HEALTH_CLIENT_SECRET_FILE: ${WEARABLES_GOOGLE_HEALTH_CLIENT_SECRET_FILE:-}
  # Optional privacy-preserving analytics: disabled by default; token is supplied
  # only through the existing bounded file-secret resolver.
  ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-false}
  EXERCISE_CATALOG_ASSETS_ENABLED: ${EXERCISE_CATALOG_ASSETS_ENABLED:-false}
  POSTHOG_PROJECT_TOKEN_FILE: ${POSTHOG_PROJECT_TOKEN_FILE:-}
  POSTHOG_IP_CAPTURE_DISABLED: ${POSTHOG_IP_CAPTURE_DISABLED:-false}
  # Optional, PHI-scrubbed error reporting (Issue #54): off without a DSN.
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}

# Backup services (Issue #64): connection settings and backup options. The
# database password and the age key arrive as files, never as values.
x-backup-env: &backup-env
  PGHOST: postgres
  PGUSER: postgres
  PGDATABASE: openvalens
  POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
  OPENVALENS_BACKUP_IDENTITY_FILE: /run/backup-secrets/age-identity
  OPENVALENS_VERSION: ${OPENVALENS_VERSION:?run deploy/setup.sh first}
  OPENVALENS_BACKUP_RETAIN: ${OPENVALENS_BACKUP_RETAIN:-10}
  OPENVALENS_BACKUP_DAILY_RETAIN: ${OPENVALENS_BACKUP_DAILY_RETAIN:-14}
  OPENVALENS_BACKUP_HOUR: ${OPENVALENS_BACKUP_HOUR:-3}
  OPENVALENS_BACKUP_SCHEDULE: ${OPENVALENS_BACKUP_SCHEDULE:-on}
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
x-backup-tool-volume: &backup-tool-volume ./backup/openvalens-backup.sh:/opt/openvalens/openvalens-backup.sh:ro
x-backup-secrets-volume: &backup-secrets-volume ./secrets/postgres:/run/secrets:ro
x-backup-key-volume: &backup-key-volume ./secrets/backup:/run/backup-secrets:ro

services:
  caddy:
    <<: *hardening
    # Pinned by version and index digest; bump deliberately.
    image: caddy:2.11.7@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    ports:
      - "${OPENVALENS_HTTP_PORT:-80}:80"
      - "${OPENVALENS_HTTPS_PORT:-443}:443"
      - "${OPENVALENS_HTTPS_PORT:-443}:443/udp"
    environment:
      OPENVALENS_DOMAIN: ${OPENVALENS_DOMAIN:?run deploy/setup.sh first}
      OPENVALENS_SITE_SCHEME: ${OPENVALENS_SITE_SCHEME:-https}
      ACME_EMAIL: ${ACME_EMAIL:?run deploy/setup.sh first}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  web:
    <<: *hardening
    image: openvalens-web:${OPENVALENS_VERSION:?run deploy/setup.sh first}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Same origin: Caddy routes the API paths to `server`.
        VITE_SERVER_URL: https://${OPENVALENS_DOMAIN:?run deploy/setup.sh first}
        # Optional browser error reporting (Issue #54), baked in at build time.
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
        VITE_SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    init: true
    environment:
      # The web document carries its own copy of the policy; keep it in step
      # with the server (docs/security-csp.md).
      CSP_MODE: ${CSP_MODE:-enforce}
    networks:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  server:
    <<: *hardening
    image: openvalens-server:${OPENVALENS_VERSION:?run deploy/setup.sh first}
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    init: true
    environment: *server-env
    volumes:
      - ./secrets/server:/run/secrets:ro
      # Stored objects are backed up with the database.
      - storage:/var/lib/openvalens/storage
      # Private export staging and downloadable archives; intentionally not backed up.
      - exports:/var/lib/openvalens/exports
    networks:
      - app
      - db
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: apply pending tracked Drizzle migrations. Runs only after the
  # pre-migrate backup step succeeded; `server` starts only if this exits 0.
  migrate:
    <<: *hardening
    image: openvalens-server:${OPENVALENS_VERSION:?run deploy/setup.sh first}
    environment: *server-env
    volumes:
      - ./secrets/server:/run/secrets:ro
    working_dir: /app/packages/db
    command: ["bun", "run", "db:migrate:deploy"]
    networks:
      - db
    depends_on:
      backup:
        condition: service_completed_successfully
    restart: "no"

  # One-shot: the pluggable pre-migrate backup hook (see pre-migrate-backup.sh).
  # Default: an encrypted, verified backup of the database and the stored files
  # into the `backups` volume (Issue #64, deploy/backup/openvalens-backup.sh).
  backup:
    <<: *hardening
    # Built from deploy/backup/Dockerfile: the pinned Postgres image (same as
    # `postgres` below) plus age and jq from the Debian archive.
    image: openvalens-backup:${OPENVALENS_VERSION:?run deploy/setup.sh first}
    build:
      context: ./backup
    entrypoint: ["/bin/sh", "/opt/openvalens/pre-migrate-backup.sh"]
    environment:
      <<: *backup-env
      OPENVALENS_PRE_MIGRATE_BACKUP: ${OPENVALENS_PRE_MIGRATE_BACKUP:-pg_dump}
      OPENVALENS_ALLOW_MIGRATE_WITHOUT_BACKUP: ${OPENVALENS_ALLOW_MIGRATE_WITHOUT_BACKUP:-}
    volumes:
      - ./pre-migrate-backup.sh:/opt/openvalens/pre-migrate-backup.sh:ro
      - ./hooks:/opt/openvalens/hooks:ro
      - *backup-tool-volume
      - *backup-secrets-volume
      - *backup-key-volume
      - backups:/backups
      - storage:/storage:ro
    networks:
      - db
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Daily encrypted backup + full verify (Issue #64). Sleeps until
  # OPENVALENS_BACKUP_HOUR (UTC), takes a backup, verifies it by restoring it
  # into a scratch database, and prunes to OPENVALENS_BACKUP_DAILY_RETAIN. When
  # the newest backup is more than a day old it takes one right away. Results
  # go to the `backup_run` table: readiness and /admin/settings show them.
  backup-scheduler:
    <<: *hardening
    image: openvalens-backup:${OPENVALENS_VERSION:?run deploy/setup.sh first}
    init: true
    entrypoint: ["/bin/bash", "/opt/openvalens/openvalens-backup.sh"]
    command: ["schedule"]
    environment: *backup-env
    volumes:
      - *backup-tool-volume
      - *backup-secrets-volume
      - *backup-key-volume
      - backups:/backups
      - storage:/storage:ro
    networks:
      - db
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Operator tooling for `deploy/setup.sh backup ...` and `restore`; never
  # started by `up`. The only backup service that may write to `storage`.
  backup-tools:
    <<: *hardening
    image: openvalens-backup:${OPENVALENS_VERSION:?run deploy/setup.sh first}
    profiles: ["tools"]
    entrypoint: ["/bin/bash", "/opt/openvalens/openvalens-backup.sh"]
    environment: *backup-env
    volumes:
      - *backup-tool-volume
      - *backup-secrets-volume
      - *backup-key-volume
      - backups:/backups
      - storage:/storage
    networks:
      - db
    restart: "no"

  # Optional off-site copy (Issue #64), started only with the `offsite` compose
  # profile, which deploy/setup.sh enables (COMPOSE_PROFILES in deploy/.env)
  # once BACKUP_OFFSITE_S3_BUCKET and both credential files exist. A separate
  # service, because it is the ONE backup service with internet access, so it
  # gets the least: no database network or password, no age key, only the
  # already-encrypted backups and two S3 credential files. It uploads every
  # finished, verified backup and applies the same retention in the bucket;
  # results go to /backups/.offsite/events for the scheduler to record. It
  # never gates a migration: an upload that fails is retried and reported.
  backup-offsite:
    <<: *hardening
    image: openvalens-backup:${OPENVALENS_VERSION:?run deploy/setup.sh first}
    profiles: ["offsite"]
    init: true
    entrypoint: ["/bin/bash", "/opt/openvalens/openvalens-backup.sh"]
    command: ["offsite-daemon"]
    environment:
      BACKUP_OFFSITE_S3_ENDPOINT: ${BACKUP_OFFSITE_S3_ENDPOINT:-}
      BACKUP_OFFSITE_S3_REGION: ${BACKUP_OFFSITE_S3_REGION:-}
      BACKUP_OFFSITE_S3_BUCKET: ${BACKUP_OFFSITE_S3_BUCKET:-}
      BACKUP_OFFSITE_S3_PREFIX: ${BACKUP_OFFSITE_S3_PREFIX:-openvalens}
      # This host's folder in the bucket; retention never touches other folders.
      OPENVALENS_BACKUP_HOST_ID: ${OPENVALENS_BACKUP_HOST_ID:-}
      BACKUP_OFFSITE_S3_FORCE_PATH_STYLE: ${BACKUP_OFFSITE_S3_FORCE_PATH_STYLE:-false}
      BACKUP_OFFSITE_S3_ACCESS_KEY_ID_FILE: /run/offsite-secrets/access-key-id
      BACKUP_OFFSITE_S3_SECRET_ACCESS_KEY_FILE: /run/offsite-secrets/secret-access-key
      OPENVALENS_BACKUP_RETAIN: ${OPENVALENS_BACKUP_RETAIN:-10}
      OPENVALENS_BACKUP_DAILY_RETAIN: ${OPENVALENS_BACKUP_DAILY_RETAIN:-14}
      OPENVALENS_OFFSITE_POLL_SECONDS: ${OPENVALENS_OFFSITE_POLL_SECONDS:-30}
    volumes:
      - *backup-tool-volume
      - ./secrets/backup/BACKUP_OFFSITE_S3_ACCESS_KEY_ID:/run/offsite-secrets/access-key-id:ro
      - ./secrets/backup/BACKUP_OFFSITE_S3_SECRET_ACCESS_KEY:/run/offsite-secrets/secret-access-key:ro
      - backups:/backups
    networks:
      - offsite
    restart: unless-stopped

  postgres:
    <<: *hardening
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: openvalens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    volumes:
      - ./secrets/postgres:/run/secrets:ro
      - postgres_data:/var/lib/postgresql
    networks:
      - db
    # No `ports:` — never publish the health database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openvalens"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  app: {}
  db:
    internal: true
  # Egress for the optional off-site uploader only (profile `offsite`).
  offsite: {}

volumes:
  postgres_data: {}
  backups: {}
  storage: {}
  exports: {}
  caddy_data: {}
  caddy_config: {}
